id = "barrier_island"
title = "Barrier island evolution by wind, storms, shoreline change and vegetation (MEEB)"
category = "bio-geomorphology"
organism = "dune-building grasses (burial-tolerant) and woody shrubs (burial-intolerant)"
host = "an undeveloped barrier island (North Core Banks, North Carolina)"
citation = "Reeves, I. R. B., Ashton, A. D., Lentz, E. E., Sherwood, C. R., Passeri, D. L. and Zeigler, S. L. (2025). Projecting management-relevant change of undeveloped coastal barriers with the Mesoscale Explicit Ecogeomorphic Barrier model (MEEB) v1.0. Geoscientific Model Development 18(23), 9319-9348."
doi = "10.5194/gmd-18-9319-2025"
bibkey = "Reeves2025"
ca_role = "Sand-slab cellular automaton on 1 m cells and weekly steps (DuBeVeg with saltation hops), with wind in four directions from a wind rose, a groundwater limit and smoothed plant cover; coupled every two weeks to high-water events (beach and dune-face erosion seaward of a detected foredune crest, overwash routed cell to cell landward of it), shoreline change (a shoreface model and wave-climate alongshore diffusion) and, once a year, two plant types growing with burial"
fidelity = "adaptation"
validation_in_source = "Hindcasts at North Core Banks against lidar and imagery: Hurricane Florence (2018) for the marine component (Brier skill 0.22 to 0.79 at four test sites) and April 2014 to September 2017 for the aeolian component (0.03 to 0.24, with the change in foredune crest height), after particle swarm calibration of 15 parameters at training sites; Morris sensitivity analyses of both; probabilistic projections to 2050 under sea-level rise."
reproduces = "The Brier skill scores of the marine component in Hurricane Florence (Table 1, Fig. 5): at the test site of Fig. 5a, shipped as barrier_florence_site, 0.65 overall, 0.69 seaward and 0.46 landward of the crest (Table 1: 0.65, 0.69, 0.46); run on MEEB 1.0.1's input files, the three other test sites give 0.64, 0.64, 0.40 (Fig. 5b: 0.64, 0.64, 0.40), 0.22, 0.19, 0.21 (Fig. 5c: 0.22, 0.19, 0.20) and 0.79, 0.79, 0.56 (Fig. 5d: 0.79, 0.79, 0.56). The aeolian hindcast of April 2014 to September 2017 (Table 1, Fig. 6), run on MEEB 1.0.1's input files at the four test sites of its script with four seeds each and the code's weekly balance: cell-by-cell Brier skill 0.22, 0.04, 0.24 and 0.22 (Table 1: 0.24, 0.03, 0.23, 0.23, its panels not matched to sites); crest-height skill -0.06 to 0.20 across sites and seeds, holding three of Table 1's four (0.04, 0.03, -0.03; its 0.22 at the top of one site's range); dune growth underestimated (crests rose 0.0 to 0.1 m against 0.17 to 0.57 m observed), as the paper reports. The shoreface depth, equilibrium slope and response rate of Table A1 from the wave climate and sediment (20.07 m, 0.00822, 5926 m3/m/yr)."
deviations = [
  "The domain is an idealised barrier (a shoreface, a linear beach to a dune toe 1.67 m above MHW, a foredune, a level interior, a back-barrier slope and bay) with uniform rows, in place of the lidar and imagery of North Core Banks the source starts from, which are not shipped (MEEB's initial elevations are 100 MB each); initial plant cover follows the paper's density classes (0.4 to 1). Only the test site of Fig. 5a is shipped, for the Florence hindcast, cropped to the 701 m cross-shore that hold the barrier and rounded to the millimetre (its scores are unchanged to two decimals).",
  "The source code is followed where the paper is brief: the dune crest procedure, the beach slopes for runup, the storm probabilities by fortnight and the synthetic and hindcast events of North Core Banks are MEEB 1.0.1's. Its erosive timescale (1.48 with 25 beach substeps in each of 25 overwash substeps an hour) is used, where Table A1 gives Te = 0.68 and swaps the two substeps.",
  "By default the plants respond to their burial over the year (balance_period = :year), as the paper says; MEEB's code clears the balance every week, so its plants respond to the burial of the week of the vegetation update only (balance_period = :week).",
  "Slabs and shadows use open boundaries, as the paper says; MEEB's code rolls the arrays, so slabs blown off one side reappear on the other and can land after a hop, and for seaward and alongshore-up winds its last column or row is not blocked.",
  "Avalanching applies to cells above MHW; MEEB's code compares the elevation in slabs with MHW in metres, so its test is nearly always true.",
  "Cells are 1 m only (MEEB 1.0.1's default and the paper's resolution); the shoreline equations of the code are in cells and per row, which agree with metres only there.",
  "Where a beach slope for runup is not finite, the previous row's is used (0.03 in the first row), as MEEB 1.1.0 does; 1.0.1 has no guard. Savitzky-Golay windows longer than the coast are shortened to it, and even ones by one; MEEB 1.0.1 needs at least 11 rows.",
  "The random numbers are Julia's, so runs match MEEB in distribution, not draw for draw.",
]
schemes = ["Synchronous"]
source_code = "MEEB 1.0.1 (https://code.usgs.gov/spcmsc/meeb/-/tree/1.0.1; Zenodo 10.5281/zenodo.15014191), the code of the paper, in the public domain (USGS) and CC0; read and ported, not run. MEEB 1.1.0 is a later recalibration."
notes = "The second bio-geomorphology model in the zoo, after dune_formation, whose slab transport it extends; MEEB's high-water events (CC0) are shipped in models/barrier_island/data."
