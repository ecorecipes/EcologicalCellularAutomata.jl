id = "bt_crop_three_layer"
title = "A Bt crop, its target pest, a secondary pest and their natural enemy on three layers"
category = "agricultural pest"
organism = "cotton bollworm (target pest), a mirid (secondary pest) and a natural enemy"
host = "Bt cotton"
citation = "Yang, J., Wang, Z.-R., Yang, D.-L., Yang, Q., Yan, J. and He, M.-F. (2009). Ecological risk assessment of genetically modified crops based on cellular automata modeling. Biotechnology Advances 27(6), 1132-1136."
doi = "10.1016/j.biotechadv.2009.05.024"
bibkey = "Yang2009"
ca_role = "Three stacked periodic lattices (plant quantity; target or secondary pest; natural enemy) in cycles: individuals move or breed in contiguous pairs of cells (a random domino tiling, as a Margolus block rule), enemies eat the pest below them and pests the plant below them with given probabilities, and individuals starve, age and die of inherited diseases as in the Penna model."
fidelity = "adaptation"
validation_in_source = "None; surfaces of the populations after 2000 cycles against the feeding and predation probabilities."
reproduces = "Only qualitatively, as the source gives no parameter values: sweeping the feeding probabilities (its Fig. 3, with P_DB = P_DC = 0.6) on a 100 x 100 torus, the plant stays near its maximum when the target pest feeds poorly and falls to about 0.6 when it always feeds (0.65-0.70 in the source); each pest is absent when it cannot feed, the secondary pest collapses when the target pest feeds better, and enemies vanish where both pests feed poorly. Sweeping the predation probabilities (its Fig. 4, with P_BA = 0.6 and P_CA = 0.5): enemies that eat the target pest well and the secondary one with probability 0.2-0.5 release the secondary pest (to 60-75% of cells, about 56-64% in the source); enemies that eat the secondary pest better than the target pest hold it down; and enemies that eat the target pest well die out when P_DC is at most 0.2, as in the source. Lowering the target pest's feeding (the source's stand-in for the Bt toxin) hands the pest layer to the secondary pest, abruptly here. Not reproduced: in the source the two pests coexist over most of both sweeps (here the better feeder excludes the other, as expected of two consumers of one resource in the same cells); without enemies its plant stays at about 0.92 (here about 0.5, as the target pest feeds alone) and rises to its maximum when enemies eat the secondary pest well (here it is highest where they hold both pests down); enemies that rarely eat the target pest persist in the source but die out here, the secondary pest being excluded; and its enemies occupy 10-17% of cells (about 20-26% here)."
deviations = [
  "Contiguous pairs are a random domino tiling: the Margolus partition into 2 x 2 blocks, shifting by one cell each cycle, with each block split into two horizontal or two vertical pairs at random, separately for the enemy and pest layers. The source says only that contiguous pairs change and that the lattice side is even; He et al. (2002), whose individuals the source uses, move each individual to a random empty von Neumann neighbour instead.",
  "An individual next to an empty cell moves into it, or in a birth cycle leaves one offspring there; the source says a mature individual breeds into the empty cell. Birth cycles follow He et al. (2002): from the maturity age R, every r cycles; one offspring (the pair has room for one), with the parent's genome and one more deleterious mutation at a random bit, starting at age 0 and no hunger.",
  "Individuals are those of He et al. (2002) (the source cites the Penna model without details): 32-bit genomes, death when the diseases expressed up to an individual's age reach a threshold T, or at age 32. The enemy takes He's predator values (maturity 4, births every 4 cycles, T = 7, hunger limit 3) and both pests his prey values (maturity 3, births every cycle, T = 3), with a hunger limit of 2 so that a pest that never eats dies before it can breed (He's prey do not starve). Genomes start clean (He's start random, with an unstated density) and ages uniform below maturity.",
  "Hunger rises by U in every cycle in which an individual does not eat (a failed attack, no prey below, a failed or impossible meal) and falls by h after a meal, not below 0; the source says hunger rises after a failed predation and in the survival check. Death when hunger exceeds its limit (the source's larger than).",
  "The plant, for which the source gives no rules or values: a quantity in units of its maximum, from which a meal of the target pest takes d_B = 0.2 and of the secondary pest d_C = 0.05 (a pest needs at least that much to feed), regrowing by 0.1 a cycle up to the maximum. The values make the plant fall with the target pest's feeding, not the secondary pest's, as in the source's Fig. 3a.",
  "In a cycle, pairs move and breed first, then enemies attack the pest in the same cell, then surviving pests feed on the plant in their cell, then individuals age and the survival checks apply, as in the source's three steps; interactions between layers are within a cell only.",
  "The source's fixed probabilities are unstated beyond P_DB = P_DC > 0.5 (Fig. 3) and P_BA > P_CA >= 0.5 (Fig. 4); 0.6, 0.6, 0.6 and 0.5 are used. The source runs 500 x 500 cells for 2000 cycles and does not say whether its surfaces are final values, time averages or replicate means; the vignette averages the last 100 of 1000 cycles of one run on 100 x 100 cells.",
]
schemes = ["Margolus"]
source_code = "None published."
notes = "The predation graph is B and C eating A, and D eating B and C; the Bt toxin enters only through a lower feeding probability of the target pest."
