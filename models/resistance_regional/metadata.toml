id = "resistance_regional"
title = "The evolution of pesticide resistance across a region of treated fields and refuges"
category = "agricultural pest"
organism = "a key insect pest with a single resistance locus (generic)"
host = "sprayed fields and refuges of an agricultural region"
citation = "Peck, S. L. and Ellner, S. P. (1997). The effect of economic thresholds and life-history parameters on the evolution of pesticide resistance in a regional setting. The American Naturalist 149(1), 43-63."
doi = "10.1086/285978"
bibkey = "Peck1997"
ca_role = "Deterministic coupled lattice of fields (after a random start): logistic growth, Hardy-Weinberg genotypes with a cost of resistance, spraying of treated fields above an economic threshold, and synchronous exchange of migrants with the von Neumann neighbours; rotated fields emptied every other generation."
fidelity = "adaptation"
validation_in_source = "None against data: a single-field model and the spatial model compared over a factorial of parameters (time to resistance, its correlations with parameters, spatial patterns and Moran's I)."
reproduces = "The single-field model of the source's Fig. 2 (one field, no migration): the time to resistance against the threshold delta at r = 1.5 is 58, 64, 72-73, 104 and 110 generations at delta = 0.2, 0.4, 0.5-0.82, 0.92 and 1 (about 57, 63-65, 71-72, 107 and 109 in the figure), and against r at delta = 0.5 is 216, 144, 108, 90, 72, 60, 48 and 37 at r = 0.35, 0.55, 0.8, 1, 1.4, 1.8, 2.5 and 3.5 (about 200, 150, 107, 85, 72, 60, 48 and 40). The spatial factorial of its Table 2 (41,472 runs of 50 x 50 fields, with rotation 0 or 0.4 as in its Table 3): mean times to resistance by r of 92, 37, 28 and 23 (92, 44, 33 and 24 in its Fig. 3), by h of 85, 29 and 21 (85, 34 and 26) and by delta of 39, 42 and 54 (45, 46 and 57); the correlations of its Table 3 (h -0.47 against -0.46, r -0.43 against -0.45, rho -0.25 against -0.24, q0 -0.16 against -0.15, delta 0.11 against 0.09, lambda -0.13 against -0.21, M 0.19 against 0.12); Moran's I at resistance rising with migration (0.19, 0.39 and 0.81 against 0.18, 0.39 and 0.82 in its Fig. 5) and the same for both shares of treated fields (0.45 and 0.46 against 0.46); the interactions of its Fig. 4 between r and delta (at r = 0.5: 71, 84 and 120 against 77, 85 and 115), r and h, and r and M; and, without rotation, the effect of migration (35, 40 and 52 generations at M = 0.005, 0.05 and 0.5 against 35, 40 and 51). Not reproduced: the delay that rotation brings at low migration (with 40% rotated, 39, 44 and 72 generations against 58, 44 and 66), which in the source makes the main effect of migration fall and rise (47, 42 and 58 against 35, 40 and 59 here)."
deviations = [
  "Migration: a share M of each field's pests (rounded down) leaves, split equally among its neighbours in the lattice. The source's equations, read literally, send a share M to each neighbour, which cannot hold for its M = 0.5 (twice the population would leave a field with four neighbours); migration = :per_neighbour gives that reading.",
  "Migrants carry their field's allele frequency, and the frequency of a field after migration is the mean of its stayers' and its immigrants', weighted by number; genotypes return to Hardy-Weinberg proportions at the next generation. The source says Hardy-Weinberg does not hold during migration but counts resistant immigrants with q squared.",
  "Rotation: a share psi of the fields, drawn at random independently of treatment, is emptied at the end of every other generation (psi_period); an emptied field keeps its last allele frequency, which does not affect the time to resistance (the regional mean first passes 0.5 in a generation when the fields have refilled). The source does not say which fields rotate, when in the generation they are emptied or what an empty field's frequency is.",
  "The start: treated fields are exactly round(lambda n^2) fields drawn at random; populations are N0 plus a uniform draw on [-10^6, 10^6], rounded down (the source writes N0 plus or minus sigma, sigma uniform on [0, 10^6]); Ks = k N0 uses the nominal N0. After it, the model is deterministic, as in the source.",
  "The defaults are the values of the source's figures (Fig. 7, with M = 0.05); its Table 2 levels are set through the keywords and pmap. The time to resistance is nothing for a run that never reaches it (the factorial above counts such runs as 250 generations, as the source's Fig. 2 suggests).",
  "Spraying every generation (delta = 0) in a single field gives resistance after 37 generations, against about 50 in the source's Fig. 2A; the source's check against May and Dobson's approximation (49) assumes resistance stays rare, which exact selection does not.",
]
schemes = ["Synchronous"]
source_code = "Not published."
notes = "The neighbourhood is the von Neumann neighbourhood, with which the source presents its results (it found no qualitative difference with the Moore neighbourhood, neighbourhood = :moore). The runs of its Fig. 9 have parameters that contradict its text, and its Fig. 7 caption contradicts its panel labels; the vignette uses the panel labels."
