id = "eab_management"
title = "Slowing the local spread of the emerald ash borer by removing ash, girdling trap trees or insecticide"
category = "forest pest"
organism = "emerald ash borer (Agrilus planipennis)"
host = "ash (Fraxinus spp.)"
citation = "Mercader, R. J., Siegert, N. W., Liebhold, A. M. and McCullough, D. G. (2011). Simulating the effectiveness of three potential management options to slow the spread of emerald ash borer (Agrilus planipennis) populations in localized outlier sites. Canadian Journal of Forest Research 41(2), 254-264."
doi = "10.1139/X10-201"
bibkey = "Mercader2011b"
ca_role = "The emerald_ash_borer coupled map lattice with a treatment in cells within a radius of the origin: ash removal, girdled trap trees destroyed with their larvae, or insecticide-protected phloem; dispersal optionally biased towards cells with girdled or stressed trees."
fidelity = "reproduction"
validation_in_source = "A simulation study on a homogeneous landscape built on the validated spread model of Mercader et al. (2011, Population Ecology); the girdled-tree attraction is fitted to larval densities on girdled and other trees at 16 Michigan outlier sites (r² = 0.87)."
reproduces = "The source's code (Supplemental Appendix S1, run in R): with transposed = true and bare = 1e-9, and the code given the same tolerance, every cell's phloem and larvae agree with it to within 1e-14 (relative) in every year, on the source's 100 x 100 landscape for 15 years, for no treatment, girdling, insecticide and ash reduction within 300 m from the first year, with and without the stress bias, and within 600 m from the third year with the stress bias. With the defaults, the radii of the source's Fig. 4 settings equal the code's (1350, 1150, 1000 and 1350 m for no treatment, girdling, insecticide and ash reduction; 1000, 850, 800 and 1000 m with the stress bias), and the larvae beyond 300 m agree within 2%. Against the article's Fig. 4 (read by eye), the code, and so the model, matches the radii without the stress bias (1350, 1150, 950 and 1350 m; insecticide 50 m less effective) and the larvae beyond 300 m (5.45, 4.45, 3.3, 5.3 million and 2.5, 2.1, 1.8, 2.8 with the bias, against 5.5, 4.3, 3.6, 5.4 and 2.4, 2.1, 1.8, 2.5), but its radii with the stress bias are 50-150 m smaller than the article's (1100, 950, 850 and 1150 m)."
deviations = [
  "The model follows the source's code, which departs from the article's text in several ways, all kept: the ratio of larval density on girdled to other trees is 18.25 (x + 1)^-0.533, at least 1, where the text gives 20.468 x^-0.559 (girdle_a, girdle_shift, girdle_b and girdle_max select the text's form, which needs a cap at low densities); dispersal spans 40 cells rather than the base model's 50, and the beetles of a cell holding no more than 0.9 are lost; the landscape has no border, so dispersal is normalised within it.",
  "Under the stress bias, as in the code, a cell's attraction is 7 x lost / (max(A0, 3) / 3), kept within 1 and 7, where lost is the phloem lost since the start by any means (the code's attempt to exclude removed phloem reads a year not yet computed and has no effect), rather than rising linearly from 1 as the text suggests; every treated cell under girdling attracts 7-fold from the first year, before treatment starts and after its large trees are gone.",
  "As in the code, under ash reduction the adults landing on the large trees of a treated cell are removed in the year treatment starts, the larvae are laid on all the phloem, and the large trees left are removed after the larvae have fed, while the larvae laid in them are kept; the code then sets every cell's large-tree phloem to its whole phloem, which affects nothing else in its runs.",
  "As in the code, insecticide kills the larvae laid in a treated cell's large-tree phloem (their density times its area), and feeding is then reduced again by the unprotected share of the phloem.",
  "Large trees hold a share of each cell's phloem, as in the code, and a cell has none where that share is at most 6.32 m²; a cell girdles one tree of 10.32 m² a year while its large-tree phloem lasts.",
  "As in the base model, transposed = true reproduces the code's indexing of each cell's beetles (from the cell with row and column swapped; nothing changes on the symmetric landscapes of the source), and bare sets the phloem at or below which a cell counts as without phloem (0 by default, as the code, where round-off decides; 1e-9 makes every eaten cell bare).",
  "The extra runs of the source's Appendix S2 (dispersal rates other than 0.037, and landscapes with phloem drawn from a normal distribution) are not included; the parameter b and the phloem keyword allow them.",
]
schemes = ["Synchronous"]
source_code = "R, in the article's Supplemental Appendix S1 (extracted from its PDF; two wrapped comment lines rejoined)."
notes = "A companion of the emerald_ash_borer model, from the same authors, reusing its dispersal. Deterministic."
